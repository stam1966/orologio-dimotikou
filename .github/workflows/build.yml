# Έλεγχος σε πραγματικά Windows με τον πραγματικό OR-Tools σε κάθε αλλαγή.
# Σε ετικέτα έκδοσης (v0.5.0 κ.λπ.): Setup.exe, πλήρες πακέτο και αρχείο ενημέρωσης στα Releases.
name: Έλεγχος και πακέτα

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Κατασκευή runtime και πακέτων
        run: python -X utf8 tools/build_package.py

      - name: Έλεγχος εκκίνησης (preflight) με το runtime του πακέτου
        working-directory: dist/Orologio_Dimotikou
        run: .\runtime\python.exe -X utf8 src\preflight.py

      - name: Αυτόματοι έλεγχοι με το runtime του πακέτου (πραγματικός OR-Tools)
        working-directory: dist/Orologio_Dimotikou
        run: |
          $out = .\runtime\python.exe -X utf8 -m unittest discover -s tests -v 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error title=Τεστ::" + ((($out -split "`n") | Select-Object -Last 40) -join '%0A')); exit 1 }

      - name: Έλεγχος λειτουργίας (δοκιμαστικό σχολείο, Edge PDF, υπηρεσία)
        working-directory: dist/Orologio_Dimotikou
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item ..\..\tools\smoke.py tools\
          $out = .\runtime\python.exe -X utf8 tools\smoke.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error title=Έλεγχος λειτουργίας::" + ((($out -split "`n") | Select-Object -Last 30) -join '%0A')); exit 1 }
          Remove-Item -Recurse -Force tools, data\app.log, data\app.url -ErrorAction SilentlyContinue

      - name: Setup.exe (Inno Setup)
        run: |
          $v = (Get-Content dist/VERSION.txt).Split('-')[0]
          try { Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Greek.isl' -OutFile installer\Greek.isl } catch { Write-Host "::warning::Greek.isl δεν κατέβηκε: $_" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $out = & $iscc "/DAppVersion=$v" "/DSourceDir=..\dist\Orologio_Dimotikou" installer\orologio.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`n" | Select-Object -Last 25) -join '%0A'
            Write-Host "::error title=Inno Setup::$tail"
            exit 1
          }

      - name: Δοκιμαστική σιωπηλή εγκατάσταση
        run: |
          $setup = Get-ChildItem dist\Orologio_Dimotikou_Setup_*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          $app = "$env:LOCALAPPDATA\Programs\OrologioDimotikou"
          if (-not (Test-Path "$app\runtime\pythonw.exe")) { throw "Η εγκατάσταση δεν δημιούργησε την εφαρμογή" }
          & "$app\runtime\python.exe" -X utf8 "$app\src\preflight.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Setup σουίτας «Σχολικές Εφαρμογές» (Ωρολόγιο + Εφημερίες)
        run: |
          $v = (Get-Content dist/VERSION.txt).Split('-')[0]
          $oro = (Get-ChildItem dist\Orologio_Dimotikou_Setup_*.exe | Select-Object -First 1).FullName
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/stam1966/efimeries-ekpaideftikon/releases/latest/download/Efimeries_Setup_x64.exe' -OutFile dist\Efimeries_Setup_x64.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $out = & $iscc "/DAppVersion=$v" "/DOroSetup=$oro" "/DEfSetup=$((Resolve-Path dist\Efimeries_Setup_x64.exe).Path)" installer\suite.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error title=Inno Setup σουίτας::" + ((($out -split "`n") | Select-Object -Last 25) -join '%0A')); exit 1 }
          $suite = Get-ChildItem dist\Sxolikes_Efarmoges_Setup_*.exe | Select-Object -First 1
          Start-Process $suite.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\EfimeriesEkpaideftikon\EfimeriesPortable_x64.exe")) { throw "Η σουίτα δεν εγκατέστησε τις Εφημερίες" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\OrologioDimotikou\runtime\pythonw.exe")) { throw "Η σουίτα δεν εγκατέστησε το Ωρολόγιο" }
          if (-not (Test-Path "$env:APPDATA\SchoolApps\suite.json")) { throw "Η σουίτα δεν έγραψε το suite.json" }
          Get-Content "$env:APPDATA\SchoolApps\suite.json"
          Copy-Item $suite.FullName dist\Sxolikes_Efarmoges_Setup.exe
          Remove-Item dist\Efimeries_Setup_x64.exe

      - name: Αντίγραφο με σταθερό όνομα (για τον μόνιμο σύνδεσμο λήψης)
        run: |
          $setup = Get-ChildItem dist\Orologio_Dimotikou_Setup_*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist\Orologio_Dimotikou_Setup.exe
          Copy-Item (Get-ChildItem dist\Orologio_Enimerosi_*.zip | Select-Object -First 1).FullName dist\Orologio_Enimerosi.zip

      - name: Είναι νέα έκδοση;
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content dist/VERSION.txt).Split('-')[0]
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "Η v$v υπάρχει ήδη." } else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "Νέα έκδοση v$v" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: orologio-${{ github.sha }}
          path: |
            dist/Orologio_Dimotikou_Setup_*.exe
            dist/Orologio_Enimerosi_*.zip
          retention-days: 14

      - name: Δημοσίευση έκδοσης
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true') || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ωρολόγιο Σχολείου ${{ steps.ver.outputs.tag }}
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/Orologio_Dimotikou_Setup_*.exe
            dist/Orologio_Dimotikou_Setup.exe
            dist/Sxolikes_Efarmoges_Setup_*.exe
            dist/Sxolikes_Efarmoges_Setup.exe
            dist/Orologio_Enimerosi.zip
            dist/Orologio_Dimotikou_*_Egkatastasi.zip
            dist/Orologio_Enimerosi_*.zip

      - name: Εφεδρική πηγή ενημερώσεων (κλάδος updates, μέσω raw.githubusercontent.com)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true') || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content dist/VERSION.txt).Trim()
          $zip = (Get-ChildItem dist\Orologio_Enimerosi_*.zip | Select-Object -First 1).FullName
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $tmp = Join-Path $env:RUNNER_TEMP 'updates'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item $zip (Join-Path $tmp 'Orologio_Enimerosi.zip')
          $notes = Get-Content dist/RELEASE_NOTES.md -Raw -Encoding utf8
          [ordered]@{app='orologio-dimotikou'; version=$v; file='Orologio_Enimerosi.zip'; sha256=$sha; notes=$notes} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $tmp 'latest.json')
          Set-Location $tmp
          git init -q
          git checkout -q -b updates
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Εφεδρική ενημέρωση $v"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" updates
          Write-Host "Εφεδρική πηγή: $v ($sha)"
