# Έλεγχος σε πραγματικά Windows με τον πραγματικό OR-Tools σε κάθε αλλαγή.
# Σε ετικέτα έκδοσης (v0.5.0 κ.λπ.): Setup.exe, πλήρες πακέτο και αρχείο ενημέρωσης στα Releases.
name: Έλεγχος και πακέτα

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Κατασκευή runtime και πακέτων
        run: python -X utf8 tools/build_package.py

      - name: Έλεγχος εκκίνησης (preflight) με το runtime του πακέτου
        working-directory: dist/Orologio_Dimotikou
        run: .\runtime\python.exe -X utf8 src\preflight.py

      - name: Αυτόματοι έλεγχοι με το runtime του πακέτου (πραγματικός OR-Tools)
        working-directory: dist/Orologio_Dimotikou
        run: |
          $out = .\runtime\python.exe -X utf8 -m unittest discover -s tests -v 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error title=Τεστ::" + ((($out -split "`n") | Select-Object -Last 40) -join '%0A')); exit 1 }

      - name: Έλεγχος λειτουργίας (δοκιμαστικό σχολείο, Edge PDF, υπηρεσία)
        working-directory: dist/Orologio_Dimotikou
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item ..\..\tools\smoke.py tools\
          $out = .\runtime\python.exe -X utf8 tools\smoke.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Host ("::error title=Έλεγχος λειτουργίας::" + ((($out -split "`n") | Select-Object -Last 30) -join '%0A')); exit 1 }
          Remove-Item -Recurse -Force tools, data\app.log, data\app.url -ErrorAction SilentlyContinue

      - name: Setup.exe (Inno Setup)
        run: |
          $v = (Get-Content dist/VERSION.txt).Split('-')[0]
          try { Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Greek.isl' -OutFile installer\Greek.isl } catch { Write-Host "::warning::Greek.isl δεν κατέβηκε: $_" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $out = & $iscc "/DAppVersion=$v" "/DSourceDir=..\dist\Orologio_Dimotikou" installer\orologio.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`n" | Select-Object -Last 25) -join '%0A'
            Write-Host "::error title=Inno Setup::$tail"
            exit 1
          }

      - name: Δοκιμαστική σιωπηλή εγκατάσταση
        run: |
          $setup = Get-ChildItem dist\Orologio_Dimotikou_Setup_*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          $app = "$env:LOCALAPPDATA\Programs\OrologioDimotikou"
          if (-not (Test-Path "$app\runtime\pythonw.exe")) { throw "Η εγκατάσταση δεν δημιούργησε την εφαρμογή" }
          & "$app\runtime\python.exe" -X utf8 "$app\src\preflight.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Αντίγραφο με σταθερό όνομα (για τον μόνιμο σύνδεσμο λήψης)
        run: |
          $setup = Get-ChildItem dist\Orologio_Dimotikou_Setup_*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist\Orologio_Dimotikou_Setup.exe

      - name: Είναι νέα έκδοση;
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content dist/VERSION.txt).Split('-')[0]
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "Η v$v υπάρχει ήδη." } else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "Νέα έκδοση v$v" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: orologio-${{ github.sha }}
          path: |
            dist/Orologio_Dimotikou_Setup_*.exe
            dist/Orologio_Enimerosi_*.zip
          retention-days: 14

      - name: Δημοσίευση έκδοσης
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true') || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ωρολόγιο Δημοτικού ${{ steps.ver.outputs.tag }}
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/Orologio_Dimotikou_Setup_*.exe
            dist/Orologio_Dimotikou_Setup.exe
            dist/Orologio_Dimotikou_*_Egkatastasi.zip
            dist/Orologio_Enimerosi_*.zip
